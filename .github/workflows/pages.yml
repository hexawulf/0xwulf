name: Deploy to GitHub Pages (static)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs on purpose: when deploy-pages ran in the
  # same job as the upload it sometimes found "0 artifacts" (the artifact was
  # not yet visible to the API) and failed; 3 of 4 runs on 2026-11-21.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional but nice for SPA/deep links: serve index.html on 404s
      - name: Add 404 fallback if missing
        run: |
          if [ ! -f 404.html ] && [ -f index.html ]; then cp index.html 404.html; fi

      # Ensure CNAME ships (you already have CNAME in repo root)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
